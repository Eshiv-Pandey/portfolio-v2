<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 400" width="712" height="400" role="img" aria-label="A B+Tree over a paged store, with its leaf sibling chain and a write-ahead log strip">
  <!-- Generated cover for KeyV DB. The project is a storage engine with no UI,
       so the cover draws what it actually is: a B+Tree whose leaves are linked,
       sitting above the write-ahead log. Palette is the site's desi accent set.

       CANVAS 712x400 (16:9) — do not crop this back to 600x400. Two containers
       show this file at different aspects, both with `object-fit: cover`:
       the detail page hero is `aspect-video` (1.778) and the grid card's
       floating screenshot works out to 1.526 (85% width over 78% height of a
       1.4 card). At 3:2 the hero cropped 16% vertically and ate the header and
       footer label rows. 16:9 satisfies the hero exactly; the grid card then
       shows the middle 610px, i.e. x 51..661. Everything that has to be
       legible is drawn inside the translated group below, which spans x 70..642
       — inside that window with room to spare. -->
  <defs>
    <pattern id="jaali" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 24 12 12 24 0 12Z" fill="none" stroke="#E9A208" stroke-width="0.7" opacity="0.35"/>
      <circle cx="12" cy="12" r="1.6" fill="#E9A208" opacity="0.28"/>
    </pattern>
    <g id="node">
      <rect width="96" height="30" rx="5" fill="#FBEFD2" stroke="#243A8E" stroke-width="1.4"/>
    </g>
  </defs>

  <rect width="712" height="400" fill="#F7F0E2"/>
  <rect width="712" height="400" fill="url(#jaali)"/>

  <!-- The drawing itself, centred in the wider canvas. See the note above. -->
  <g transform="translate(56 0)">
  <rect x="14" y="14" width="572" height="372" rx="6" fill="none" stroke="#0E7C7B" stroke-width="1.2" stroke-dasharray="1 5" stroke-linecap="round"/>

  <text x="34" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2" fill="#B3202C">KEYV · STORAGE ENGINE</text>

  <!-- root -> internal -->
  <g stroke="#243A8E" stroke-width="1.3" opacity="0.75" fill="none">
    <path d="M300 106 300 122 118 122 118 140"/>
    <path d="M300 106 300 140"/>
    <path d="M300 106 300 122 482 122 482 140"/>
  </g>

  <!-- internal -> leaves -->
  <g stroke="#243A8E" stroke-width="1.1" opacity="0.55" fill="none">
    <path d="M118 170 118 186 66 186 66 206"/>
    <path d="M118 170 118 186 170 186 170 206"/>
    <path d="M300 170 300 206"/>
    <path d="M482 170 482 186 430 186 430 206"/>
    <path d="M482 170 482 186 534 186 534 206"/>
  </g>

  <!-- root -->
  <g transform="translate(252 76)">
    <rect width="96" height="30" rx="5" fill="#E9A208" stroke="#243A8E" stroke-width="1.6"/>
    <text x="48" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#5A3B00">root · k7 k19</text>
  </g>

  <!-- internal -->
  <g transform="translate(70 140)"><use href="#node"/><text x="48" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#243A8E">k2 k5</text></g>
  <g transform="translate(252 140)"><use href="#node"/><text x="48" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#243A8E">k11</text></g>
  <g transform="translate(434 140)"><use href="#node"/><text x="48" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#243A8E">k24 k31</text></g>

  <!-- leaves -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#0E7C7B" text-anchor="middle">
    <g transform="translate(30 206)"><rect width="72" height="26" rx="4" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.2"/><text x="36" y="17">page 01</text></g>
    <g transform="translate(134 206)"><rect width="72" height="26" rx="4" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.2"/><text x="36" y="17">page 02</text></g>
    <g transform="translate(264 206)"><rect width="72" height="26" rx="4" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.2"/><text x="36" y="17">page 03</text></g>
    <g transform="translate(394 206)"><rect width="72" height="26" rx="4" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.2"/><text x="36" y="17">page 04</text></g>
    <g transform="translate(498 206)"><rect width="72" height="26" rx="4" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="1.2"/><text x="36" y="17">page 05</text></g>
  </g>

  <!-- the leaf sibling chain, which is the whole point of a B+Tree -->
  <g stroke="#C2185B" stroke-width="1.3" fill="none">
    <path d="M102 219 H134 M206 219 H264 M336 219 H394 M466 219 H498"/>
    <g fill="#C2185B" stroke="none">
      <path d="M134 219 128 216 128 222Z"/>
      <path d="M264 219 258 216 258 222Z"/>
      <path d="M394 219 388 216 388 222Z"/>
      <path d="M498 219 492 216 492 222Z"/>
    </g>
  </g>
  <text x="300" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" letter-spacing="1.6" fill="#C2185B">LINKED LEAVES · RANGE SCAN</text>

  <!-- write-ahead log -->
  <text x="30" y="298" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#243A8E">WAL</text>
  <g>
    <rect x="30" y="306" width="540" height="34" rx="4" fill="#FFFFFF" stroke="#243A8E" stroke-width="1.2"/>
    <g stroke="#243A8E" stroke-width="0.9" opacity="0.45">
      <path d="M97 306v34M164 306v34M231 306v34M298 306v34M365 306v34M432 306v34M499 306v34"/>
    </g>
    <g fill="#E9A208">
      <rect x="31" y="307" width="66" height="32" rx="3"/>
      <rect x="98" y="307" width="66" height="32" rx="3"/>
      <rect x="165" y="307" width="66" height="32" rx="3"/>
      <rect x="232" y="307" width="66" height="32" rx="3" opacity="0.6"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5A3B00" text-anchor="middle">
      <text x="64" y="327">lsn 41</text>
      <text x="131" y="327">lsn 42</text>
      <text x="198" y="327">lsn 43</text>
    </g>
    <text x="534" y="327" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#243A8E" opacity="0.5">…</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#0E7C7B">
    <text x="30" y="366">ARIES RECOVERY</text>
    <text x="170" y="366">STRICT 2PL</text>
    <text x="286" y="366">DEADLOCK DETECTION</text>
    <text x="462" y="366">TCP BINARY</text>
  </g>
  </g>
</svg>
